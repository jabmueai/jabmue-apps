    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti for victory celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" crossorigin="anonymous"></script>

    <style>
        * {
            font-family: 'Mali', cursive, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        /* Custom animations for child engagement */
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 182, 193, 0.7); }
            70% { transform: scale(1.02); box-shadow: 0 0 0 20px rgba(255, 182, 193, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 182, 193, 0); }
        }

        .animate-bounce-slow {
            animation: bounce-slow 2s infinite ease-in-out;
        }

        .animate-pulse-ring {
            animation: pulse-ring 2s infinite;
        }

        /* SVG Mouth Highlight Animation */
        .teeth-highlight {
            transition: all 0.5s ease;
        }
        .active-zone {
            fill: #FFD700 !important;
            filter: drop-shadow(0px 0px 8px #FF9900);
            animation: pulse-ring 1s infinite;
        }
    </style>

<body class="bg-gradient-to-b from-sky-300 via-pink-200 to-yellow-100 min-h-screen flex flex-col justify-between p-4 sm:p-6 overflow-x-hidden">

    <!-- Header & Streak Counter -->
    <header class="w-full max-w-md mx-auto flex justify-between items-center bg-white/80 backdrop-blur-md p-4 rounded-3xl shadow-lg border-4 border-white">
        <div class="flex items-center gap-2">
            <span class="text-3xl">🪥</span>
            <h1 class="text-xl sm:text-2xl font-extrabold text-sky-600 tracking-wide">แปรงฟันหรรษา</h1>
        </div>
        <!-- Days Streak -->
        <div class="flex items-center gap-1 bg-amber-100 px-3 py-1.5 rounded-2xl border-2 border-amber-300">
            <span class="text-2xl">⭐</span>
            <div class="text-left leading-tight">
                <div class="text-xs text-amber-800 font-bold">สะสมดาว</div>
                <div class="text-lg font-black text-amber-600"><span id="streak-count">0</span> วัน</div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-md mx-auto my-auto flex flex-col items-center justify-center gap-4 py-2">
        
        <!-- Interactive Teeth Diagram & Zone Banner -->
        <div class="w-full bg-white rounded-3xl p-5 shadow-xl border-4 border-pink-300 flex flex-col items-center relative overflow-hidden">
            
            <!-- Zone Title Header -->
            <div id="zone-banner" class="w-full bg-sky-400 text-white text-center text-xl sm:text-2xl font-black py-2 px-4 rounded-2xl shadow-md transition-all duration-300 mb-3">เตรียมพร้อมแปรงฟันกันเลย!</div>

            <!-- Tooth Visual Map -->
            <div class="relative w-48 h-48 sm:w-56 sm:h-56 my-2 flex items-center justify-center">
                <svg viewBox="0 0 200 200" class="w-full h-full drop-shadow-md">
                    <!-- Background mouth base -->
                    <path d="M 30,100 Q 30,20 100,20 Q 170,20 170,100 Q 170,180 100,180 Q 30,180 30,100 Z" fill="#FF8A8A" stroke="#E65151" stroke-width="6"></path>
                    <path d="M 50,100 Q 50,40 100,40 Q 150,40 150,100 Q 150,160 100,160 Q 50,160 50,100 Z" fill="#6B0D0D"></path>

                    <!-- Upper Left Teeth Arc (Screen Upper Left = Patient Upper Left from viewer perspective) -->
                    <!-- Top Left Zone ( Quadrant 1: Top Left in view ) -->
                    <g id="zone-tl" class="teeth-highlight" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2">
                        <path d="M 60,65 Q 75,45 95,43 L 95,58 Q 78,60 68,75 Z"></path>
                        <path d="M 45,85 Q 50,70 60,65 L 68,75 Q 58,80 55,90 Z"></path>
                    </g>

                    <!-- Upper Right Zone ( Quadrant 2: Top Right in view ) -->
                    <g id="zone-tr" class="teeth-highlight" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2">
                        <path d="M 140,65 Q 125,45 105,43 L 105,58 Q 122,60 132,75 Z"></path>
                        <path d="M 155,85 Q 150,70 140,65 L 132,75 Q 142,80 145,90 Z"></path>
                    </g>

                    <!-- Lower Left Zone ( Quadrant 3: Bottom Left in view ) -->
                    <g id="zone-bl" class="teeth-highlight" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2">
                        <path d="M 45,115 Q 50,130 60,135 L 68,125 Q 58,120 55,110 Z"></path>
                        <path d="M 60,135 Q 75,155 95,157 L 95,142 Q 78,140 68,125 Z"></path>
                    </g>

                    <!-- Lower Right Zone ( Quadrant 4: Bottom Right in view ) -->
                    <g id="zone-br" class="teeth-highlight" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2">
                        <path d="M 155,115 Q 150,130 140,135 L 132,125 Q 142,120 145,110 Z"></path>
                        <path d="M 140,135 Q 125,155 105,157 L 105,142 Q 122,140 132,125 Z"></path>
                    </g>

                    <!-- Tongue in center -->
                    <path d="M 70,120 Q 100,100 130,120 Q 115,150 85,150 Z" fill="#FF6B8B" opacity="0.8"></path>
                </svg>

                <!-- Animated Tooth Mascot Icon -->
                <div id="mascot" class="absolute inset-0 flex items-center justify-center pointer-events-none transition-all duration-500">
                    <span class="text-5xl sm:text-6xl filter drop-shadow-lg animate-bounce-slow">🪥</span>
                </div>
            </div>

            <!-- Big Countdown Timer Display -->
            <div class="text-center my-1">
                <div id="timer-display" class="text-6xl sm:text-7xl font-black text-slate-800 tracking-wider">02:00</div>
                <div id="zone-timer" class="text-lg font-bold text-sky-600 h-6">กดปุ่มเริ่มเพื่อเริ่มสะอาดยิ้มสวย!</div>
            </div>

            <!-- Progress Bar (Total 2 mins) -->
            <div class="w-full bg-slate-100 h-6 rounded-full overflow-hidden border-2 border-slate-200 p-0.5 mt-2">
                <div id="progress-bar" class="bg-gradient-to-r from-emerald-400 to-teal-500 h-full rounded-full transition-all duration-300 w-0" style="width: 0%;"></div>
            </div>

            <!-- 4 Phase Indicators -->
            <div class="grid grid-cols-4 gap-1.5 w-full mt-3">
                <div id="step-1" class="text-center py-1 rounded-xl bg-slate-100 text-slate-400 font-bold text-xs border border-slate-200">1. บนซ้าย</div>
                <div id="step-2" class="text-center py-1 rounded-xl bg-slate-100 text-slate-400 font-bold text-xs border border-slate-200">2. บนขวา</div>
                <div id="step-3" class="text-center py-1 rounded-xl bg-slate-100 text-slate-400 font-bold text-xs border border-slate-200">3. ล่างซ้าย</div>
                <div id="step-4" class="text-center py-1 rounded-xl bg-slate-100 text-slate-400 font-bold text-xs border border-slate-200">4. ล่างขวา</div>
            </div>

        </div>

        <!-- Controls Section -->
        <div class="w-full flex flex-col gap-3">
            <!-- Main Giant Start/Pause Button -->
            <button id="btn-main" onclick="toggleTimer()" class="w-full py-5 px-6 rounded-3xl bg-gradient-to-b from-emerald-400 to-emerald-500 text-white text-2xl sm:text-3xl font-black shadow-lg hover:brightness-105 active:scale-95 transition-all border-b-8 border-emerald-700 animate-pulse-ring flex items-center justify-center gap-3">
                <span>🚀</span>
                <span id="btn-main-text">เริ่มแปรงฟัน!</span>
            </button>

            <!-- Reset Button (Hidden initially or secondary) -->
            <button id="btn-reset" onclick="resetTimer()" class="w-full py-3 rounded-2xl bg-white/80 text-slate-600 font-extrabold text-lg shadow border-2 border-slate-200 hover:bg-slate-50 active:scale-95 transition flex items-center justify-center gap-2">
                <span>🔄</span> เริ่มใหม่
            </button>
        </div>

    </main>

    <!-- Success Modal Overlay -->
    <div id="success-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-yellow-300 flex flex-col items-center gap-4 animate-bounce-slow">
            <div class="text-7xl">🌟</div>
            <h2 class="text-3xl font-black text-emerald-600">เก่งมากๆ เลยครับ!</h2>
            <p class="text-xl font-bold text-slate-700">ฟันสะอาด เงาวับ สะอาดกริ๊บ!</p>
            <div class="bg-amber-50 p-4 rounded-2xl border-2 border-amber-200 w-full">
                <p class="text-amber-800 font-bold text-lg">คุณแปรงฟันครบแล้ว</p>
                <p class="text-3xl font-black text-amber-500 my-1"><span id="modal-streak">1</span> วันติดกัน!</p>
                <p class="text-xs text-amber-700">พรุ่งนี้มาแปรงฟันสะสมดาวกันอีกนะ ⭐</p>
            </div>
            <button onclick="closeSuccessModal()" class="w-full py-4 bg-gradient-to-b from-sky-400 to-sky-500 text-white text-xl font-black rounded-2xl shadow-lg border-b-4 border-sky-700 active:scale-95 transition">
                รับดาวแล้วปิด ✨
            </button>
        </div>
    </div>

    <!-- Audio Synthesizer JavaScript (Web Audio API - iOS Friendly without external MP3 dependencies) -->
    <script>
        // Web Audio API Context for playing sounds on iOS Safari
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Play "Ting!" sound for phase changes
        function playChimeSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 note
                osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.3); // A6 note

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
                console.log('Audio play error:', e);
            }
        }

        // Play Victory Tune at the end
        function playVictorySound() {
            try {
                initAudio();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, index) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.15);

                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime + index * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.15 + 0.3);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start(audioCtx.currentTime + index * 0.15);
                    osc.stop(audioCtx.currentTime + index * 0.15 + 0.3);
                });
            } catch (e) {
                console.log('Audio play error:', e);
            }
        }

        // Timer Configuration
        const TOTAL_TIME = 120; // 2 minutes (120 seconds)
        const ZONE_TIME = 30;   // 30 seconds per quadrant

        // 4 Quadrant Definitions
        const ZONES = [
            {
                id: 'tl',
                name: 'ฟันบน - ด้านซ้าย 🦷',
                bgClass: 'bg-pink-400',
                stepId: 'step-1'
            },
            {
                id: 'tr',
                name: 'ฟันบน - ด้านขวา 🦷',
                bgClass: 'bg-purple-400',
                stepId: 'step-2'
            },
            {
                id: 'bl',
                name: 'ฟันล่าง - ด้านซ้าย 🦷',
                bgClass: 'bg-sky-400',
                stepId: 'step-3'
            },
            {
                id: 'br',
                name: 'ฟันล่าง - ด้านขวา 🦷',
                bgClass: 'bg-emerald-400',
                stepId: 'step-4'
            }
        ];

        let timeLeft = TOTAL_TIME;
        let timerInterval = null;
        let isRunning = false;
        let currentZoneIndex = -1;

        // DOM Element references
        const timerDisplay = document.getElementById('timer-display');
        const zoneTimerDisplay = document.getElementById('zone-timer');
        const zoneBanner = document.getElementById('zone-banner');
        const progressBar = document.getElementById('progress-bar');
        const btnMain = document.getElementById('btn-main');
        const btnMainText = document.getElementById('btn-main-text');
        const streakCountDisplay = document.getElementById('streak-count');
        const successModal = document.getElementById('success-modal');
        const modalStreak = document.getElementById('modal-streak');

        // Initialize App & Load Saved Streak
        window.onload = function() {
            loadStreak();
            updateDisplay();
        };

        // Load Streak from LocalStorage
        function loadStreak() {
            const savedData = JSON.parse(localStorage.getItem('brushing_streak') || '{}');
            const today = new Date().toDateString();

            if (savedData.lastDate) {
                const lastDate = new Date(savedData.lastDate);
                const currentDate = new Date(today);
                const diffTime = Math.abs(currentDate - lastDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                // If more than 1 day missed, streak resets (unless same day)
                if (diffDays > 1 && savedData.lastDate !== today) {
                    savedData.count = 0;
                    localStorage.setItem('brushing_streak', JSON.stringify(savedData));
                }
            }

            streakCountDisplay.textContent = savedData.count || 0;
        }

        // Save Streak when completed
        function incrementStreak() {
            const today = new Date().toDateString();
            let savedData = JSON.parse(localStorage.getItem('brushing_streak') || '{}');

            // Only increment if not already brushed today
            if (savedData.lastDate !== today) {
                savedData.count = (savedData.count || 0) + 1;
                savedData.lastDate = today;
                localStorage.setItem('brushing_streak', JSON.stringify(savedData));
            }

            streakCountDisplay.textContent = savedData.count;
            modalStreak.textContent = savedData.count;
        }

        // Main Timer Toggle Button
        function toggleTimer() {
            initAudio(); // Initialize audio context on first user touch (iOS requirement)

            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (timeLeft <= 0) return;
            
            isRunning = true;
            btnMainText.textContent = "พักแปรงฟัน";
            btnMain.className = btnMain.className.replace('from-emerald-400 to-emerald-500 border-emerald-700', 'from-amber-400 to-amber-500 border-amber-700');
            btnMain.querySelector('span').textContent = '⏸️';

            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();

                if (timeLeft <= 0) {
                    completeBrushing();
                }
            }, 1000);

            // Update display immediately
            updateDisplay();
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            btnMainText.textContent = "แปรงฟันต่อ";
            btnMain.className = btnMain.className.replace('from-amber-400 to-amber-500 border-amber-700', 'from-emerald-400 to-emerald-500 border-emerald-700');
            btnMain.querySelector('span').textContent = '▶️';
        }

        function resetTimer() {
            pauseTimer();
            timeLeft = TOTAL_TIME;
            currentZoneIndex = -1;
            btnMainText.textContent = "เริ่มแปรงฟัน!";
            btnMain.querySelector('span').textContent = '🚀';
            updateDisplay();
        }

        // Update Screen Elements based on Time Left
        function updateDisplay() {
            // Minutes and Seconds calculation
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            // Progress Bar Width
            const progressPercent = ((TOTAL_TIME - timeLeft) / TOTAL_TIME) * 100;
            progressBar.style.width = `${progressPercent}%`;

            if (timeLeft === TOTAL_TIME) {
                zoneBanner.textContent = "เตรียมพร้อมแปรงฟันกันเลย!";
                zoneBanner.className = "w-full bg-sky-400 text-white text-center text-xl sm:text-2xl font-black py-2 px-4 rounded-2xl shadow-md transition-all duration-300 mb-3";
                zoneTimerDisplay.textContent = "กดปุ่มเริ่มเพื่อเริ่มสะอาดยิ้มสวย!";
                clearTeethHighlights();
                resetStepIndicators();
                return;
            }

            // Determine Active Zone (0, 1, 2, or 3)
            const elapsedTime = TOTAL_TIME - timeLeft;
            const newZoneIndex = Math.min(Math.floor(elapsedTime / ZONE_TIME), 3);
            const secondsInCurrentZone = ZONE_TIME - (elapsedTime % ZONE_TIME);

            // Trigger "Ting" Sound and Visual Updates on Zone Switch
            if (newZoneIndex !== currentZoneIndex) {
                currentZoneIndex = newZoneIndex;
                if (isRunning) playChimeSound();
                highlightZone(ZONES[currentZoneIndex]);
            }

            zoneTimerDisplay.textContent = `แปรงโซนนี้อีก ${secondsInCurrentZone} วินาที ⏳`;
        }

        // Highlight active tooth quadrant in SVG and UI Step pills
        function highlightZone(zone) {
            zoneBanner.textContent = zone.name;
            zoneBanner.className = `w-full ${zone.bgClass} text-white text-center text-xl sm:text-2xl font-black py-2 px-4 rounded-2xl shadow-md transition-all duration-300 mb-3 animate-bounce-slow`;

            // Reset SVG Highlights
            clearTeethHighlights();

            // Set Active SVG Zone
            const svgGroup = document.getElementById(`zone-${zone.id}`);
            if (svgGroup) {
                svgGroup.classList.add('active-zone');
            }

            // Update Steps Indicators
            ZONES.forEach((z, index) => {
                const stepElem = document.getElementById(z.stepId);
                if (index === currentZoneIndex) {
                    stepElem.className = "text-center py-1 rounded-xl bg-amber-400 text-white font-black text-xs shadow border border-amber-500 scale-105 transition-transform";
                } else if (index < currentZoneIndex) {
                    stepElem.className = "text-center py-1 rounded-xl bg-emerald-100 text-emerald-600 font-bold text-xs border border-emerald-300";
                } else {
                    stepElem.className = "text-center py-1 rounded-xl bg-slate-100 text-slate-400 font-bold text-xs border border-slate-200";
                }
            });
        }

        function clearTeethHighlights() {
            document.querySelectorAll('.teeth-highlight').forEach(el => {
                el.classList.remove('active-zone');
            });
        }

        function resetStepIndicators() {
            ZONES.forEach(z => {
                const stepElem = document.getElementById(z.stepId);
                stepElem.className = "text-center py-1 rounded-xl bg-slate-100 text-slate-400 font-bold text-xs border border-slate-200";
            });
        }

        // Brushing Complete Handler
        function completeBrushing() {
            pauseTimer();
            incrementStreak();
            playVictorySound();

            // Fire Confetti Celebration
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }

            // Show Success Modal
            successModal.classList.remove('hidden');
        }

        function closeSuccessModal() {
            successModal.classList.add('hidden');
            resetTimer();
        }
    </script>

</body></html>
