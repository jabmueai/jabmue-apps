<title>ลอยกระทงออนไลน์ - สืบสานประเพณีไทย</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลดฟอนต์ Prompt จาก Google Fonts เพื่อให้อ่านง่ายและสวยงาม -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&amp;display=swap" rel="stylesheet">
    
    <style>
        /* ตั้งค่าฟอนต์หลักและป้องกันการเลื่อนหน้าจอเกินขอบ */
        body {
            font-family: 'Prompt', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* แอนิเมชันแสงจันทร์สะท้อนผิวน้ำ */
        @keyframes shimmer {
            0%, 100% { transform: scaleX(1) translateY(0); opacity: 0.6; }
            50% { transform: scaleX(1.15) translateY(2px); opacity: 0.9; }
        }
        .moon-reflection {
            animation: shimmer 4s infinite ease-in-out;
        }

        /* แอนิเมชันเปลวเทียนกระพริบ */
        @keyframes flicker {
            0%, 100% { transform: scale(1) rotate(-2deg); opacity: 0.95; }
            25% { transform: scale(1.1, 0.9) rotate(2deg); opacity: 1; }
            50% { transform: scale(0.95, 1.05) rotate(-1deg); opacity: 0.85; }
            75% { transform: scale(1.05, 0.95) rotate(3deg); opacity: 1; }
        }
        .candle-flame {
            transform-origin: bottom center;
            animation: flicker 0.8s infinite alternate;
        }

        /* แอนิเมชันควันธูปลอยขึ้น */
        @keyframes smoke {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            100% { transform: translateY(-25px) scale(1.8); opacity: 0; }
        }
        .incense-smoke {
            animation: smoke 2.5s infinite ease-out;
        }

        /* แอนิเมชันกระทงโคลงเคลงเบาๆ ตามคลื่นน้ำ */
        @keyframes bobbing {
            0%, 100% { transform: translateY(0px) rotate(-1.5deg); }
            50% { transform: translateY(-6px) rotate(1.5deg); }
        }
        .krathong-bob {
            animation: bobbing 3s infinite ease-in-out;
        }

        /* แอนิเมชันคำอธิษฐานลอยขึ้นฟ้า */
        @keyframes floatWishUp {
            0% { transform: translate(-50%, 0) scale(0.8); opacity: 0; }
            15% { transform: translate(-50%, -20px) scale(1); opacity: 1; }
            80% { transform: translate(-50%, -180px) scale(1.05); opacity: 0.9; }
            100% { transform: translate(-50%, -240px) scale(1.1); opacity: 0; }
        }
        .wish-floating {
            animation: floatWishUp 6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        /* ปรับแต่ง Scrollbar สำหรับหน้าจอมือถือเล็ก */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>

    <!-- ==================== JavaScript ควบคุมการทำงานทั้งหมด ==================== -->
    <script>
        // --- 1. สถานะของแอปพลิเคชัน (State) ---
        let state = {
            type: 'banana',      // 'banana' | 'lotus' | 'bread'
            flowerColor: 'yellow', // 'yellow' | 'pink' | 'purple' | 'white'
            count: 0,
            isLaunching: false
        };

        // ชุดสีของดอกไม้แต่ละแบบ
        const flowerPalettes = {
            yellow: { main: '#FACC15', dark: '#CA8A04', center: '#EA580C' },
            pink:   { main: '#F472B6', dark: '#DB2777', center: '#FDE047' },
            purple: { main: '#C084FC', dark: '#9333EA', center: '#FDE047' },
            white:  { main: '#F8FAFC', dark: '#CBD5E1', center: '#F59E0B' }
        };

        // คำอธิษฐานตัวอย่างสำหรับปุ่มสุ่ม
        const sampleWishes = [
            "ขอให้ครอบครัวมีความสุข สุขภาพแข็งแรงตลอดปี",
            "ขอให้การงานราบรื่น การเงินคล่องตัว ร่ำรวยเงินทอง",
            "ขอให้สิ่งไม่ดีลอยไปกับสายน้ำ พบเจอแต่สิ่งดีๆ",
            "ขอให้สมหวังในความรัก และมีรอยยิ้มในทุกๆ วัน",
            "ขอขมาพระแม่คงคา และขอให้ชีวิตสงบร่มเย็น"
        ];

        // --- 2. ระบบเสียงสังเคราะห์ด้วย Web Audio API (ไม่ใช้ไฟล์เสียงภายนอก) ---
        let audioCtx = null;
        let isSoundOn = false;
        let waterNoiseNode = null;
        let waterGainNode = null;

        // ฟังก์ชันเริ่มต้น AudioContext และสร้างเสียงน้ำไหลเบาๆ
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (!waterNoiseNode) {
                startAmbientWaterSound();
            }
        }

        // สร้างเสียงคลื่นน้ำเบาๆ (Filtered Pink/Brown Noise)
        function startAmbientWaterSound() {
            const bufferSize = audioCtx.sampleRate * 3;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let lastOut = 0.0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                // Brown noise filter เพื่อให้เสียงทุ้มนุ่มเหมือนน้ำไหล
                output[i] = (lastOut + (0.02 * white)) / 1.02;
                lastOut = output[i];
                output[i] *= 2.5;
            }

            waterNoiseNode = audioCtx.createBufferSource();
            waterNoiseNode.buffer = noiseBuffer;
            waterNoiseNode.loop = true;

            // Lowpass filter ให้เสียงนุ่มนวล
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 320;

            waterGainNode = audioCtx.createGain();
            waterGainNode.gain.value = isSoundOn ? 0.08 : 0.0;

            waterNoiseNode.connect(filter);
            filter.connect(waterGainNode);
            waterGainNode.connect(audioCtx.destination);
            waterNoiseNode.start(0);
        }

        // ปุ่มเปิด/ปิดเสียง
        function toggleAudio() {
            isSoundOn = !isSoundOn;
            const icon = document.getElementById('sound-icon');
            const text = document.getElementById('sound-text');

            if (isSoundOn) {
                initAudio();
                if (waterGainNode) waterGainNode.gain.setTargetAtTime(0.08, audioCtx.currentTime, 0.2);
                icon.textContent = '🔊';
                text.textContent = 'เปิดเสียงอยู่';
                playBellSound(); // เล่นเสียงกระดิ่งเบาๆ ยืนยันว่าเปิดเสียงแล้ว
            } else {
                if (waterGainNode && audioCtx) waterGainNode.gain.setTargetAtTime(0.0, audioCtx.currentTime, 0.2);
                icon.textContent = '🔇';
                text.textContent = 'เปิดเสียง';
            }
        }

        // เสียงกระดิ่งกังวานตอนปล่อยกระทง
        function playBellSound() {
            if (!isSoundOn) return;
            initAudio();
            const now = audioCtx.currentTime;
            // ความถี่โน้ต Pentatonic แบบไทยๆ
            const freqs = [523.25, 659.25, 783.99, 1046.50]; 
            
            freqs.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + index * 0.12);

                gain.gain.setValueAtTime(0.001, now + index * 0.12);
                gain.gain.exponentialRampToValueAtTime(0.15 / (index + 1), now + index * 0.12 + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.12 + 1.8);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + index * 0.12);
                osc.stop(now + index * 0.12 + 1.9);
            });
        }

        // เสียงพลุแตกบนท้องฟ้า (Noise burst + Low boom)
        function playFireworkSound() {
            if (!isSoundOn || !audioCtx) return;
            const now = audioCtx.currentTime;

            // 1. เสียงทุ้มตอนพลุระเบิด
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(110, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);

            oscGain.gain.setValueAtTime(0.25, now);
            oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

            osc.connect(oscGain);
            oscGain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.5);

            // 2. เสียงซ่าของประกายไฟ
            const bufferSize = audioCtx.sampleRate * 0.8;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.25));
            }

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1200;

            const noiseGain = audioCtx.createGain();
            noiseGain.gain.setValueAtTime(0.22, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

            noise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioCtx.destination);
            noise.start(now);
        }

                    <circle cx="100" cy="36" r="3" fill="rgba(255,255,255,0.4)" class="incense-smoke" style="animation-delay: 0.8s" />
                    <circle cx="108" cy="40" r="2.5" fill="rgba(255,255,255,0.5)" class="incense-smoke" style="animation-delay: 1.5s" />

                    <!-- ธูป 3 ดอก -->
                    <line x1="94" y1="125" x2="88" y2="52" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="100" y1="125" x2="100" y2="48" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
                    <line x1="106" y1="125" x2="112" y2="52" stroke="#D97706" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- ปลายธูปติดไฟสีแดงส้ม -->
                    <circle cx="88" cy="52" r="2" fill="#EF4444" class="candle-flame"/>
                    <circle cx="100" cy="48" r="2.2" fill="#F97316" class="candle-flame"/>
                    <circle cx="112" cy="52" r="2" fill="#EF4444" class="candle-flame"/>

                    <!-- เทียนเล่มตรงกลาง -->
                    <rect x="96" y="78" width="8" height="48" rx="2" fill="#FDE047" stroke="#CA8A04" stroke-width="1"/>
                    <!-- ไส้เทียน -->
                    <line x1="100" y1="78" x2="100" y2="73" stroke="#1E293B" stroke-width="1.5"/>
                    <!-- เปลวเทียนกระพริบพร้อมแสงเรืองรอง -->
                    <g class="candle-flame">
                        <circle cx="100" cy="64" r="14" fill="rgba(253, 224, 71, 0.35)" />
                        <path d="M100,52 Q107,64 100,73 Q93,64 100,52 Z" fill="#FB923C" />
                        <path d="M100,57 Q104,65 100,71 Q96,65 100,57 Z" fill="#FEF08A" />
                    </g>

                    <!-- ตัวกระทงที่เลือก -->
                    ${baseSVG}

                    <!-- ดอกไม้ตกแต่ง 3 ดอกด้านหน้า -->
                    <!-- ดอกซ้าย -->
                    <g transform="translate(65, 134)">
                        <circle cx="0" cy="0" r="10" fill="${c.main}" stroke="${c.dark}" stroke-width="1.5"/>
                        <circle cx="0" cy="0" r="4" fill="${c.center}"/>
                    </g>
                    <!-- ดอกขวา -->
                    <g transform="translate(135, 134)">
                        <circle cx="0" cy="0" r="10" fill="${c.main}" stroke="${c.dark}" stroke-width="1.5"/>
                        <circle cx="0" cy="0" r="4" fill="${c.center}"/>
                    </g>
                    <!-- ดอกกลาง -->
                    <g transform="translate(100, 138)">
                        <circle cx="0" cy="0" r="12" fill="${c.main}" stroke="${c.dark}" stroke-width="1.5"/>
                        <circle cx="0" cy="0" r="5" fill="${c.center}"/>
                    </g>
                </svg>
            `;
        }

        // อัปเดตตัวอย่างกระทงบนหน้าจอ
        function renderPreview() {
            const container = document.getElementById('preview-krathong');
            container.innerHTML = generateKrathongSVG(state.type, state.flowerColor);
        }

        // --- 4. การโต้ตอบเลือกแบบกระทงและสีดอกไม้ ---
        function selectType(type) {
            state.type = type;
            // อัปเดตสไตล์ปุ่มที่เลือก
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.remove('border-amber-400', 'bg-amber-500/20', 'text-white');
                btn.classList.add('border-slate-700', 'bg-slate-800/80', 'text-slate-300');
            });
            const activeBtn = document.getElementById(`btn-type-${type}`);
            activeBtn.classList.remove('border-slate-700', 'bg-slate-800/80', 'text-slate-300');
            activeBtn.classList.add('border-amber-400', 'bg-amber-500/20', 'text-white');

            renderPreview();
        }

        function selectColor(color) {
            state.flowerColor = color;
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.remove('ring-4', 'ring-white', 'scale-105');
                btn.classList.add('opacity-75');
            });
            const activeBtn = document.getElementById(`color-${color}`);
            activeBtn.classList.remove('opacity-75');
            activeBtn.classList.add('ring-4', 'ring-white', 'scale-105');

            renderPreview();
        }

        function randomWish() {
            const input = document.getElementById('wish-input');
            const randomIndex = Math.floor(Math.random() * sampleWishes.length);
            input.value = sampleWishes[randomIndex];
        }

        // --- 5. ระบบปล่อยกระทงลงน้ำ & เอฟเฟกต์พลุ ---
        function launchKrathong() {
            if (state.isLaunching) return;
            state.isLaunching = true;

            // เล่นเสียงกระดิ่ง (ถ้าเปิดเสียงอยู่)
            playBellSound();

            // ดึงข้อความอธิษฐาน (ถ้าไม่พิมพ์ให้ใส่คำอวยพรเริ่มต้น)
            const wishInput = document.getElementById('wish-input');
            const wishText = wishInput.value.trim() || "ขอให้มีความสุข ความเจริญ ตลอดไป 🙏";

            // ซ่อนแผงควบคุมด้านล่างเพื่อให้เห็นฉากแม่น้ำและพลุเต็มตา
            const controlPanel = document.getElementById('control-panel');
            controlPanel.classList.add('translate-y-full');

            // ซ่อนกระทงตัวอย่างตรงกลาง
            const previewWrapper = document.getElementById('preview-krathong-wrapper');
            previewWrapper.style.opacity = '0';

            // สร้างกระทงจริงลงในชั้นผิวน้ำและให้ค่อยๆ ลอยห่างออกไป
            spawnFloatingKrathong(state.type, state.flowerColor, wishText);

            // แสดงข้อความคำอธิษฐานลอยขึ้นไปบนท้องฟ้า
            showFloatingWish(wishText);

            // จุดพลุเฉลิมฉลองบนท้องฟ้า 3 ลูกต่อเนื่อง
            setTimeout(() => launchFirework(), 400);
            setTimeout(() => launchFirework(), 1100);
            setTimeout(() => launchFirework(), 1800);

            // บันทึกสถิติลง LocalStorage
            state.count += 1;
            localStorage.setItem('loy_krathong_count', state.count);
            document.getElementById('krathong-count').textContent = state.count;

            // แสดงปุ่มให้กดประดิษฐ์กระทงใบใหม่ได้หลังจากผ่านไป 3.5 วินาที
            setTimeout(() => {
                document.getElementById('relaunch-bar').classList.remove('hidden');
            }, 3500);
        }

        // สร้างกระทงที่ลอยออกไปบนแม่น้ำ (ค่อยๆ เล็กลงและลอยไปตามกระแสน้ำ)
        function spawnFloatingKrathong(type, color, wish) {
            const layer = document.getElementById('floating-krathongs-layer');
            const krathongEl = document.createElement('div');
            
            // ตำแหน่งเริ่มต้นบริเวณกลางแม่น้ำด้านล่าง
            const startX = 50 + (Math.random() * 16 - 8); // 42% - 58%
            krathongEl.style.position = 'absolute';
            krathongEl.style.left = `${startX}%`;
            krathongEl.style.top = '55%';
            krathongEl.style.width = '140px';
            krathongEl.style.height = '140px';
            krathongEl.style.transform = 'translate(-50%, -50%) scale(1)';
            krathongEl.style.transition = 'all 22s cubic-bezier(0.2, 0.6, 0.4, 1)';
            krathongEl.className = 'krathong-bob';

            krathongEl.innerHTML = generateKrathongSVG(type, color);
            layer.appendChild(krathongEl);

            // สั่งให้เคลื่อนที่หลังจากถูกเพิ่มลง DOM
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    // ลอยเฉียงไปทางซ้ายหรือขวาและไกลออกไปทางเส้นขอบฟ้า (top: 4%)
                    const driftX = startX + (Math.random() * 50 - 25);
                    krathongEl.style.top = '3%';
                    krathongEl.style.left = `${Math.max(10, Math.min(90, driftX))}%`;
                    krathongEl.style.transform = 'translate(-50%, -50%) scale(0.28)';
                    krathongEl.style.opacity = '0.75';
                });
            });

            // ลบออกเมื่อลอยลับสายตาไปแล้ว (23 วินาที)
            setTimeout(() => {
                krathongEl.remove();
            }, 23000);
        }

        // แสดงคำอธิษฐานลอยขึ้นไปบนฟ้า
        function showFloatingWish(text) {
            const container = document.getElementById('floating-wish-container');
            const wishBadge = document.createElement('div');
            wishBadge.className = 'wish-floating inline-block bg-slate-900/80 backdrop-blur-md border border-amber-300/60 text-amber-200 px-5 py-3 rounded-2xl shadow-[0_0_25px_rgba(251,191,36,0.4)] text-lg font-semibold max-w-xs break-words';
            wishBadge.innerHTML = `✨ "${escapeHTML(text)}" ✨`;
            
            container.appendChild(wishBadge);

            setTimeout(() => {
                wishBadge.remove();
            }, 6200);
        }

        // รีเซ็ตหน้าจอเพื่อประดิษฐ์กระทงใบใหม่
        function resetForNewKrathong() {
            state.isLaunching = false;
            document.getElementById('relaunch-bar').classList.add('hidden');
            document.getElementById('control-panel').classList.remove('translate-y-full');
            
            const previewWrapper = document.getElementById('preview-krathong-wrapper');
            previewWrapper.style.opacity = '1';
        }

        // ป้องกัน XSS จากข้อความที่ผู้ใช้พิมพ์
        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // --- 6. Canvas Animation: คลื่นน้ำไหวเบาๆ และ พลุบนท้องฟ้า ---
        const canvas = document.getElementById('effects-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let ripples = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // สร้างคลื่นน้ำระยิบระยับเบาๆ ตลอดเวลา
        function createWaterRipples() {
            const riverTop = canvas.height * 0.45;
            for (let i = 0; i < 28; i++) {
                ripples.push({
                    x: Math.random() * canvas.width,
                    y: riverTop + Math.random() * (canvas.height - riverTop),
                    length: 20 + Math.random() * 50,
                    speed: 0.2 + Math.random() * 0.4,
                    alpha: 0.05 + Math.random() * 0.15,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }
        createWaterRipples();

        // สร้างพลุ 1 ลูก
        function launchFirework() {
            playFireworkSound();
            const x = canvas.width * (0.2 + Math.random() * 0.6);
            const y = canvas.height * (0.12 + Math.random() * 0.22);
            const colors = ['#FDE047', '#F472B6', '#38BDF8', '#A78BFA', '#FB923C', '#4ADE80'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            // แตกตัวเป็นสะเก็ดไฟ 45 เส้น
            for (let i = 0; i < 45; i++) {
                const angle = (Math.PI * 2 * i) / 45 + (Math.random() * 0.1);
                const speed = 1.5 + Math.random() * 3.5;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: color,
                    alpha: 1,
                    decay: 0.012 + Math.random() * 0.012,
                    size: 2 + Math.random() * 2
                });
            }
        }

        // ลูปแอนิเมชันหลัก
        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. วาดเส้นคลื่นน้ำไหวเบาๆ
            ripples.forEach(r => {
                r.x += r.speed;
                r.phase += 0.03;
                if (r.x > canvas.width) r.x = -r.length;

                const currentAlpha = r.alpha * (0.6 + 0.4 * Math.sin(r.phase));
                ctx.strokeStyle = `rgba(186, 230, 253, ${currentAlpha})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(r.x, r.y);
                ctx.lineTo(r.x + r.length, r.y);
                ctx.stroke();
            });

            // 2. วาดสะเก็ดพลุบนท้องฟ้า
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.04; // แรงโน้มถ่วงดึงลงเบาๆ
                p.vx *= 0.98;
                p.vy *= 0.98;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            requestAnimationFrame(animateCanvas);
        }

        // --- 7. สร้างดวงดาวบนท้องฟ้า ---
        function generateStars() {
            const container = document.getElementById('stars-container');
            for (let i = 0; i < 35; i++) {
                const star = document.createElement('div');
                const size = Math.random() * 2.5 + 1;
                star.style.position = 'absolute';
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 90}%`;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.backgroundColor = '#FEF9C3';
                star.style.borderRadius = '50%';
                star.style.opacity = Math.random() * 0.8 + 0.2;
                container.appendChild(star);
            }
        }

        // --- 8. เริ่มต้นการทำงานเมื่อโหลดหน้าเว็บเสร็จ ---
        window.onload = function() {
            // โหลดจำนวนกระทงที่เคยลอยไว้จาก LocalStorage
            const savedCount = localStorage.getItem('loy_krathong_count');
            if (savedCount) {
                state.count = parseInt(savedCount, 10) || 0;
                document.getElementById('krathong-count').textContent = state.count;
            }

            generateStars();
            renderPreview();
            animateCanvas();
        };
    </script>
